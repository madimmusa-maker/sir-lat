name: Пробы голоса

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Фраза для проб (можно оставить как есть)"
        required: false
        default: "Приветствую, путники! Я сэр Лат, и сегодня у нас самый безумный скрытый класс!"

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
      SAMPLE_TEXT: ${{ inputs.text }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить ffmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg

      - name: Установить зависимости
        run: |
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Кэш модели Silero
        uses: actions/cache@v4
        with:
          path: ~/.cache/silero
          key: silero-v4_ru

      - name: Озвучить пробы
        run: python -m sirlat.voice_samples --text "$SAMPLE_TEXT" --out voice_samples

      - name: Сохранить пробы
        uses: actions/upload-artifact@v4
        with:
          name: proby-golosa-${{ github.run_number }}
          path: voice_samples/
          if-no-files-found: error
          retention-days: 30
