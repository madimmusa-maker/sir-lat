name: Сделать видео

on:
  workflow_dispatch:
    inputs:
      notes_file:
        description: "Файл заметок: имя (goblin_ch1.txt) или путь (notes/goblin_ch1.txt); ищется во всех папках notes/"
        required: true
        default: "notes/example.txt"
      format:
        description: "Формат видео"
        required: true
        type: choice
        default: long
        options:
          - long
          - short
          - both
      minutes:
        description: "Желаемая длина длинного видео, минут (10–30)"
        required: false
        default: "14"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      PYTHONUNBUFFERED: "1"
      # тайминги слов для субтитров и клюва: medium точнее small
      WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'medium' }}
      PIPER_MODEL_DIR: ~/.cache/piper
      NOTES_FILE: ${{ inputs.notes_file }}
      VIDEO_FORMAT: ${{ inputs.format }}
      VIDEO_MINUTES: ${{ inputs.minutes }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить ffmpeg и шрифты
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-dejavu-core fonts-noto-color-emoji

      - name: Установить зависимости
        run: pip install -r requirements.txt

      # голос сэра Лата: Piper IGM (rraaww/ru_piper) — скачивается один раз
      - name: Кэш голоса Piper IGM
        uses: actions/cache@v4
        with:
          path: ~/.cache/piper
          key: piper-ru_RU-igm3804-medium-v1

      - name: Скачать голос Piper IGM
        run: |
          mkdir -p ~/.cache/piper && cd ~/.cache/piper
          for f in ru_RU-igm3804-medium.onnx ru_RU-igm3804-medium.onnx.json; do
            if [ ! -s "$f" ]; then
              curl -fsSL --retry 4 --retry-delay 5 -o "$f" \
                "https://huggingface.co/rraaww/ru_piper/resolve/main/$f" || {
                echo "::error::Не удалось скачать голос IGM ($f) с huggingface.co/rraaww/ru_piper"; exit 1; }
            fi
          done
          ls -la ~/.cache/piper

      - name: Кэш модели faster-whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ vars.WHISPER_MODEL || 'medium' }}-v1

      - name: Найти файл заметок
        # Ищем во всех папках notes/ репозитория. Можно указать путь
        # (notes/goblin_ch1.txt), просто имя (goblin_ch1.txt) или имя без .txt.
        run: |
          list_notes() {
            find . \( -path ./.git -o -path ./output -o -path ./.cache \) -prune -o \
              -type f -path '*/notes/*' -print | sed 's|^\./||' | sort
          }
          want="${NOTES_FILE#./}"
          if [ -f "$want" ]; then
            found="$want"
          else
            name="$(basename "$want")"
            matches="$(list_notes | awk -F/ -v n="$name" '$NF==n || $NF==n".txt"')"
            count="$(printf '%s' "$matches" | grep -c . || true)"
            if [ "$count" -eq 1 ]; then
              found="$matches"
            elif [ "$count" -gt 1 ]; then
              echo "::error::Найдено несколько файлов «$name». Укажите путь полностью:"
              echo "$matches"
              exit 1
            else
              echo "::error::Файл «$want» не найден ни в одной папке notes/. Доступные заметки:"
              list_notes
              exit 1
            fi
          fi
          echo "Файл заметок: $found"
          echo "NOTES_FILE=$found" >> "$GITHUB_ENV"

      - name: Собрать видео
        run: >
          python -m sirlat
          --notes "$NOTES_FILE"
          --format "$VIDEO_FORMAT"
          --minutes "${VIDEO_MINUTES:-14}"

      - name: Сохранить видео и сценарии
        uses: actions/upload-artifact@v4
        with:
          name: sir-lat-${{ inputs.format }}-${{ github.run_number }}
          path: |
            output/**/*.mp4
            output/**/script_*.txt
          if-no-files-found: error
          retention-days: 14
